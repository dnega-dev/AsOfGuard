[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asof-guard"
version = "0.1.0"
description = "Zero-dependency temporal contamination verifier for RAG and agent-memory traces"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AsOfGuard contributors" }]
keywords = ["rag", "temporal", "provenance", "verification", "agent-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dnega-dev/AsOfGuard"
Repository = "https://github.com/dnega-dev/AsOfGuard"
Issues = "https://github.com/dnega-dev/AsOfGuard/issues"
Changelog = "https://github.com/dnega-dev/AsOfGuard/blob/main/CHANGELOG.md"

[project.scripts]
asof-guard = "asof_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asof_guard.fixtures" = ["*.jsonl"]
